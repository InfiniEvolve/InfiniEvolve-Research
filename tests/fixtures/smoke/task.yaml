instruction: |
  This is a scripted integration check, not a research experiment.
  Verify that your native ARIS research skills and helpers are readable, then improve solution.py.
  Leave any research records in the workspace so InfiniEvolve can archive them.
evaluate: ["{python}", "{task}/evaluate.py"]
metric: {name: mse, direction: min, scale: absolute}
# The integration test supplies the scripted agent command explicitly.
time_limit_seconds: 30
evaluate_timeout_seconds: 10
