[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinievolve-research"
version = "0.1.0"
description = "ARIS research skills for agents launched by InfiniEvolve"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["infinievolve==0.1.0"]

[project.scripts]
infinievolve-research = "infinievolve_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
